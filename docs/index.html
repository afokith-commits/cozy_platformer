<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sproutbound — Cozy Micro-Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #181216;
      color: #faf3e0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      margin-bottom: 12px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #f4c04e;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    p.subtitle {
      color: #7ca890;
      font-size: 0.95rem;
      margin-top: 4px;
    }
    #game-container {
      position: relative;
      box-shadow: 0 12px 36px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #704f3b;
      background: #000;
    }
    canvas {
      display: block;
      width: min(1280px, 95vw, calc(76vh * 16 / 9));
      aspect-ratio: 16 / 9;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    footer {
      margin-top: 14px;
      display: flex;
      gap: 24px;
      color: #dbc69e;
      font-size: 0.88rem;
    }
    .key {
      background: #4a3429;
      color: #ffe47a;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌱 Sproutbound</h1>
    <p class="subtitle">A Cozy Micro-Platformer • Built for Web & Desktop</p>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <footer>
    <div><span class="key">A / D / ← →</span> Move</div>
    <div><span class="key">Space / W / ↑</span> Jump &amp; Glide</div>
    <div><span class="key">Shift / X</span> Dash</div>
    <div><span class="key">E / Enter</span> Interact</div>
    <div><span class="key">Tab</span> Bag</div>
    <div><span class="key">M</span> Map</div>
    <div><span class="key">J</span> Journal</div>
    <div><span class="key">Esc</span> Menu</div>
  </footer>

  <script src="game.js"></script>
</body>
</html>
