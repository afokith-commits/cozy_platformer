<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sproutbound — Cozy Micro-Platformer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: #181216;
      color: #faf3e0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #2a1d22 0%, #140f13 100%);
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.85);
      border: 2px solid #593e30;
      border-radius: 6px;
    }
    #game-container:fullscreen canvas {
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    #controls-bar {
      position: absolute;
      bottom: 10px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(24, 18, 22, 0.7);
      color: #dbc69e;
      font-size: 12px;
      opacity: 0.45;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #game-container:hover #controls-bar { opacity: 0.9; }
    .key {
      background: #4a3429;
      color: #ffe47a;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: bold;
    }
    #fs-btn {
      position: absolute;
      bottom: 10px;
      right: 12px;
      padding: 6px 12px;
      border: 2px solid #9a7154;
      border-radius: 8px;
      background: rgba(46, 33, 28, 0.85);
      color: #ffe47a;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s, transform 0.1s;
    }
    #fs-btn:hover { opacity: 1; transform: scale(1.04); }
    #game-container:fullscreen #controls-bar { display: none; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="controls-bar">
      <span><span class="key">A/D/←→</span> Move</span>
      <span><span class="key">Space/W/↑</span> Jump &amp; Glide</span>
      <span><span class="key">Shift/X</span> Dash</span>
      <span><span class="key">E</span> Interact</span>
      <span><span class="key">Tab</span> Bag</span>
      <span><span class="key">M</span> Map</span>
      <span><span class="key">J</span> Journal</span>
      <span><span class="key">Esc</span> Menu</span>
    </div>

    <button id="fs-btn" type="button">⛶ Fullscreen [F]</button>
  </div>

  <script src="game.js"></script>
  <script>
    const container = document.getElementById("game-container");
    const fsBtn = document.getElementById("fs-btn");

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        container.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    fsBtn.addEventListener("click", () => {
      toggleFullscreen();
      fsBtn.blur(); // Prevents Spacebar from re-clicking the button
    });

    window.addEventListener("keydown", (e) => {
      if ((e.key === "f" || e.key === "F") && !e.repeat && !e.ctrlKey && !e.metaKey) {
        toggleFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fsBtn.textContent = document.fullscreenElement ? "✕ Exit [F]" : "⛶ Fullscreen [F]";
    });
  </script>
</body>
</html>
